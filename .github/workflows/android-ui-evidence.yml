name: Android UI evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/capture-android-ui.py'
      - '.github/workflows/android-ui-evidence.yml'

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'wearable/ui-optical-frame'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install screenshot emulator
        run: |
          set -eu
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$sdk/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | "$sdk/avdmanager" create avd -n optical-evidence -k "system-images;android-35;google_apis;x86_64" --force
      - name: Build actual app debug UI (not a distribution APK)
        working-directory: android
        run: |
          # UI evidence only: omit gigabyte-scale bundled model weights, never use
          # this APK for release or installation on the user's device.
          ./gradlew :app:assembleDebug -Popenrayneo.abis=x86_64 -x :app:prepareBundledSpeech -x :app:prepareBundledTranslation --console=plain
      - name: Capture real Android screens
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/optical-ui"
          "$ANDROID_HOME/emulator/emulator" -avd optical-evidence -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/optical-ui/emulator.log" 2>&1 &
          timeout 420 adb wait-for-device
          python3 scripts/capture-android-ui.py --apk android/app/build/outputs/apk/debug/app-debug.apk --out "$RUNNER_TEMP/optical-ui"
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optical-native-ui-${{ github.sha }}
          path: ${{ runner.temp }}/optical-ui/
          if-no-files-found: warn
          retention-days: 14
