name: Temporary Android UI smoke
on:
  push:
    branches: [wearable/ui-smoke-20261126]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install emulator and build SDK
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" > /dev/null
          test -c /dev/kvm || { echo "::error::KVM unavailable; cannot run Android emulator."; exit 1; }
          sudo chmod a+rw /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n wearable_ui -k "system-images;android-35;google_apis;x86_64" --force
      - name: Build isolated emulator validation app (no distribution signing)
        working-directory: android
        run: ./gradlew :app:assembleValidation -Popenrayneo.abis=x86_64 --console=plain
      - name: Boot emulator and verify real app navigation
        run: |
          set -euo pipefail
          mkdir -p ui-smoke-output
          "$ANDROID_HOME/emulator/emulator" -avd wearable_ui -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 300 adb wait-for-device
          for n in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size 1080x2340
          adb shell wm density 420
          adb install android/app/build/outputs/apk/validation/app-validation.apk
          adb shell am start -W -n com.openrayneo.android.validation/com.openrayneo.android.MainActivity
          python3 scripts/ui-smoke-temporary.py
      - name: Capture diagnostic on failure
        if: failure()
        run: |
          mkdir -p ui-smoke-output
          adb exec-out screencap -p > ui-smoke-output/final-failure.png || true
          adb logcat -d -t 2500 > ui-smoke-output/logcat.txt || true
          if [ -f "$RUNNER_TEMP/emulator.log" ]; then cp "$RUNNER_TEMP/emulator.log" ui-smoke-output/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-android-ui-smoke
          path: ui-smoke-output/
          retention-days: 14
