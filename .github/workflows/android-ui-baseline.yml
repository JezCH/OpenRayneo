name: Android V3 native baseline

on:
  push:
    branches: [wearable/ui-optical-baseline]

permissions:
  contents: read

jobs:
  capture:
    if: github.repository == 'JezCH/OpenRayneo'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify exact V3 Android source
        run: |
          set -eu
          git diff --exit-code 648965d43a0fef23a32306fc5920be231a1d51a1 HEAD -- android ThirdParty
          echo "Baseline app commit: 648965d43a0fef23a32306fc5920be231a1d51a1"
      - name: Install screenshot emulator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/optical-ui"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          # Headless QEMU still links audio, GL and X11 runtime libraries.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 libasound2t64 libgl1 libegl1 libgbm1 libdrm2 libnss3 libx11-6 libx11-xcb1 libxcb1 libxcb-cursor0 libxkbcommon0 libxkbcommon-x11-0 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libxrender1 libxdamage1 libxfixes3 libxext6 libsm6 libice6 libfontconfig1 libfreetype6 libdbus-1-3 libxcb-shm0 libxcb-render0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-shape0 libxcb-keysyms1 libxcb-image0 libxcb-icccm4 libxcb-util1 libxss1 libxshmfence1 mesa-vulkan-drivers 2>&1 | tee "$RUNNER_TEMP/optical-ui/host-dependencies.log"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$sdk/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          "$ANDROID_HOME/platform-tools/adb" version
          qemu="$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          test -x "$qemu"
          LD_LIBRARY_PATH="$ANDROID_HOME/emulator/lib64:$ANDROID_HOME/emulator/lib64/qt/lib:${LD_LIBRARY_PATH:-}" ldd "$qemu" | tee "$RUNNER_TEMP/optical-ui/qemu-ldd.log"
          if grep -F 'not found' "$RUNNER_TEMP/optical-ui/qemu-ldd.log"; then exit 1; fi
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -accel-check
          printf '%s\n' "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          # The Java AVD manager and native emulator must use the same directory.
          export ANDROID_USER_HOME="$RUNNER_TEMP/optical-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf '%s\n' "ANDROID_USER_HOME=$ANDROID_USER_HOME" "ANDROID_EMULATOR_HOME=$ANDROID_EMULATOR_HOME" "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          avd="$ANDROID_AVD_HOME/optical-evidence.avd"
          printf 'no\n' | "$sdk/avdmanager" create avd --name optical-evidence --package "system-images;android-35;google_apis;x86_64" --abi x86_64 --path "$avd" --force 2>&1 | tee "$RUNNER_TEMP/optical-ui/avd-create.log"
          ls -la "$ANDROID_AVD_HOME"
          test -s "$avd/config.ini"
          # Some command-line tools write the descriptor in their legacy home.
          # Reconstruct only the pointer to an actually created AVD, never
          # invent its hardware configuration or claim successful creation.
          ini="$ANDROID_AVD_HOME/optical-evidence.ini"
          if [ ! -s "$ini" ] || ! grep -Fx "path=$avd" "$ini"; then
            printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$avd" > "$ini"
          fi
          cp "$ini" "$RUNNER_TEMP/optical-ui/avd-descriptor.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee "$RUNNER_TEMP/optical-ui/avd-list.log"
          grep -Fx optical-evidence "$RUNNER_TEMP/optical-ui/avd-list.log"
      - name: Boot Android and verify ADB before building APK
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          out="$RUNNER_TEMP/optical-ui"
          mkdir -p "$out"
          test -s "$ANDROID_AVD_HOME/optical-evidence.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx optical-evidence
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd optical-evidence -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$out/emulator.log" 2>&1 < /dev/null &
          echo $! > "$out/emulator.pid"
          # Fail on early emulator death, not after a full APK rebuild.
          for i in $(seq 1 150); do
            if ! kill -0 "$(cat "$out/emulator.pid")" 2>/dev/null; then
              tail -n 120 "$out/emulator.log"
              exit 1
            fi
            if [ "$(timeout 8 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = 1 ] && timeout 8 adb -s emulator-5554 shell pm path android >/dev/null 2>&1; then
              adb -s emulator-5554 shell input keyevent 82
              adb devices -l
              adb -s emulator-5554 shell getprop ro.build.version.sdk
              # Prove the Android graphics stack can produce a frame before
              # investing in the application build. Not an app screenshot.
              adb -s emulator-5554 exec-out screencap -p > "$out/boot-frame.bin"
              python3 -c 'import sys; from pathlib import Path; assert Path(sys.argv[1]).read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a"))' "$out/boot-frame.bin"
              exit 0
            fi
            sleep 3
          done
          tail -n 120 "$out/emulator.log"
          exit 1
      - name: Build actual app debug UI (not a distribution APK)
        working-directory: android
        run: |
          # UI evidence only: omit gigabyte-scale bundled model weights, never use
          # this APK for release or installation on the user's device.
          ./gradlew :app:assembleDebug -Popenrayneo.abis=x86_64 -x :app:prepareBundledSpeech -x :app:prepareBundledTranslation --console=plain
      - name: Capture real Android screens
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_SERIAL=emulator-5554
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          python3 scripts/capture-android-ui.py --apk android/app/build/outputs/apk/debug/app-debug.apk --out "$RUNNER_TEMP/optical-ui"
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optical-v3-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/optical-ui/
          if-no-files-found: warn
          retention-days: 14
      - name: Emit compact actual screenshots for visual review
        if: always()
        run: |
          set -eu
          out="$RUNNER_TEMP/optical-ui"
          if ! compgen -G "$out/*.png" > /dev/null; then
            echo "No captured PNGs; see emulator and runtime logs."
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/evidence-venv"
          "$RUNNER_TEMP/evidence-venv/bin/pip" -q install pillow==11.3.0
          "$RUNNER_TEMP/evidence-venv/bin/python" - <<'PY'
          import os, base64, io
          from pathlib import Path
          from PIL import Image
          for path in sorted((Path(os.environ["RUNNER_TEMP"]) / "optical-ui").glob("*.png")):
              img = Image.open(path).convert("RGB")
              img.thumbnail((540, 1170), Image.Resampling.LANCZOS)
              out = io.BytesIO()
              img.save(out, format="JPEG", quality=72, optimize=True)
              b64 = base64.b64encode(out.getvalue()).decode()
              for i in range(0,len(b64),1800):
                  print(f"EVIDENCE_JPEG {path.stem} {i//1800:04d} {b64[i:i+1800]}")
          PY
