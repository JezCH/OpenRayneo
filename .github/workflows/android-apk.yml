name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/prepare-android-voice.sh"
      - "scripts/prepare-android-mozilla.py"
      - "scripts/build-install-bundle.py"
      - "ThirdParty/SherpaOnnx/**"
      - "integrations/dsh-go/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/prepare-android-voice.sh"
      - "scripts/prepare-android-mozilla.py"
      - "scripts/build-install-bundle.py"
      - "ThirdParty/SherpaOnnx/**"
      - "integrations/dsh-go/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Package to update (validation is the active development app)"
        type: choice
        options: [validation, release]
        default: validation
      validation_signer:
        description: "Installed validation APK certificate SHA-256 (64 hex characters)"
        type: string
        required: false
      publish_validation:
        description: "Explicitly publish the verified validation APK to public GitHub Releases"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      DISTRIBUTE_APK: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
      APK_TARGET: ${{ inputs.target || 'validation' }}
      VALIDATION_EXPECTED_SIGNER: ${{ inputs.validation_signer || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK Platform 36 / Build-Tools 36.0.0
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # Explicit main workflow dispatch is the only distribution path. Push/PR runs compile only.
      # Store base64 of ~/.android/debug.keystore as repository secret ANDROID_DEBUG_KEYSTORE_B64.
      # Trusted main pushes also inspect the registered key without distributing an APK.
      # PRs never receive the signing secret. Report only the public certificate fingerprint.
      - name: Restore and diagnose signing keystore
        if: env.DISTRIBUTE_APK == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            set -o pipefail
            umask 077
            signing_file="$RUNNER_TEMP/openrayneo-distribution.keystore"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$signing_file"
            restored_signer=$(keytool -exportcert -keystore "$signing_file" -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')
            echo "Restored signing certificate SHA-256: $restored_signer"
            if [ "$DISTRIBUTE_APK" != "true" ]; then
              echo "Registered signing certificate inspected; no APK distribution requested."
              rm -f "$signing_file"
              exit 0
            fi
            if [ "$APK_TARGET" = "validation" ]; then
              expected=$(printf '%s' "$VALIDATION_EXPECTED_SIGNER" | tr -d ':' | tr '[:upper:]' '[:lower:]')
              if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::Enter the installed validation app certificate SHA-256 before updating."
                exit 1
              fi
            elif [ "$APK_TARGET" = "release" ]; then
              expected="cb13b9f191e8212e0eb0c343aa833fc94ef10a8c4477c317ec74b5d2bcce6b70"
            else
              echo "::error::Invalid distribution target."
              exit 1
            fi
            if [ "$restored_signer" != "$expected" ]; then
              echo "::error::Registered key does not match the selected installed app. Do not uninstall or change the certificate pin to bypass this check."
              exit 1
            fi
            echo "OPENRAYNEO_EXPECTED_SIGNER=$expected" >> "$GITHUB_ENV"
            echo "OPENRAYNEO_RESTORED_SIGNER=$restored_signer" >> "$GITHUB_ENV"
            echo "OPENRAYNEO_SIGNING_KEYSTORE=$signing_file" >> "$GITHUB_ENV"
            echo "OPENRAYNEO_FIXED_SIGNING=true" >> "$GITHUB_ENV"
            echo "Using explicitly selected distribution keystore"
          else
            echo "::error::Fixed signing key missing. Distribution blocked; configure ANDROID_DEBUG_KEYSTORE_B64 before publishing."
            if [ "$DISTRIBUTE_APK" = "true" ]; then exit 1; fi
          fi

      - uses: gradle/actions/setup-gradle@v4

      # Fork run numbers start independently of upstream; keep the version non-negative and traceable.
      - name: Set version
        run: echo "OPENRAYNEO_VERSION_NAME=1.2.0-wearable.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Compile Android variants (no installation APK)
        if: env.DISTRIBUTE_APK != 'true'
        working-directory: android
        run: ./gradlew :app:compileReleaseKotlin :app:compileValidationKotlin --console=plain

      - name: Build selected APK
        if: env.DISTRIBUTE_APK == 'true'
        working-directory: android
        run: |
          # Surface compiler/lint errors as annotations so they are readable without opening the raw log.
          set -o pipefail
          case "$APK_TARGET" in
            validation) task=assembleValidation ;;
            release) task=assembleRelease ;;
            *) exit 1 ;;
          esac
          ./gradlew ":app:$task" --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            # One annotation (GitHub keeps only a few per step); newlines encoded as %0A.
            msg=$( { grep -E '^e: |error:' "$RUNNER_TEMP/gradle.log"; grep -A12 'What went wrong' "$RUNNER_TEMP/gradle.log"; } | grep -v '^> Task' | head -50 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::$msg"
            exit 1
          }

      - name: Verify APK signature
        if: env.DISTRIBUTE_APK == 'true'
        run: |
          set -o pipefail
          case "$APK_TARGET" in
            validation) apk=android/app/build/outputs/apk/validation/app-validation.apk; package=com.openrayneo.android.validation ;;
            release) apk=android/app/build/outputs/apk/release/app-release.apk; package=com.openrayneo.android ;;
            *) exit 1 ;;
          esac
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/openrayneo-certs.txt"
          actual_signer=$(awk '/^Signer #[0-9]+ certificate SHA-256 digest:/ {print tolower($NF)}' "$RUNNER_TEMP/openrayneo-certs.txt")
          test "$actual_signer" = "$OPENRAYNEO_RESTORED_SIGNER" || { echo "::error::APK did not use restored signing key."; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/openrayneo-badging.txt"
          grep -F "package: name='$package' versionCode='$((1000 + GITHUB_RUN_NUMBER))'" "$RUNNER_TEMP/openrayneo-badging.txt" || { echo "::error::Incorrect APK package or versionCode"; exit 1; }

      - name: Verify selected distribution signer continuity
        if: env.DISTRIBUTE_APK == 'true'
        run: |
          signer=$(awk '/^Signer #[0-9]+ certificate SHA-256 digest:/ {print tolower($NF)}' "$RUNNER_TEMP/openrayneo-certs.txt")
          test "$signer" = "$OPENRAYNEO_EXPECTED_SIGNER" || { echo "::error::APK signer does not match the selected installed app."; exit 1; }

      - name: Check DSH plugin policies
        working-directory: integrations/dsh-go
        run: node --test tests/ambient-model.test.mjs tests/hint-preview.test.mjs

      - name: Pack DSH Go plugin
        if: env.DISTRIBUTE_APK == 'true'
        working-directory: integrations/dsh-go
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Assemble verified installation bundle
        if: env.DISTRIBUTE_APK == 'true' && env.APK_TARGET == 'release'
        run: |
          python3 scripts/build-install-bundle.py \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --plugin "$RUNNER_TEMP"/openrayneo-dsh-*.tgz \
            --cert-report "$RUNNER_TEMP/openrayneo-certs.txt" \
            --badging "$RUNNER_TEMP/openrayneo-badging.txt" \
            --commit "$GITHUB_SHA" --run "$GITHUB_RUN_NUMBER" \
            --fixed-signing-key "${OPENRAYNEO_FIXED_SIGNING:-false}" \
            --out "$RUNNER_TEMP/openrayneo-install"

      - name: Include exact Mozilla corresponding source
        if: env.DISTRIBUTE_APK == 'true' && env.APK_TARGET == 'release'
        run: cp .build/android-mozilla/mozilla-native-8eada038-r2.sources.tar.gz "$RUNNER_TEMP/openrayneo-install/"

      - uses: actions/upload-artifact@v4
        if: env.DISTRIBUTE_APK == 'true' && env.APK_TARGET == 'release'
        with:
          name: openrayneo-android-${{ github.sha }}
          path: ${{ runner.temp }}/openrayneo-install/
          if-no-files-found: error

      - name: Package validation in-place update
        if: env.DISTRIBUTE_APK == 'true' && env.APK_TARGET == 'validation'
        run: |
          mkdir -p "$RUNNER_TEMP/openrayneo-validation-update"
          cp android/app/build/outputs/apk/validation/app-validation.apk "$RUNNER_TEMP/openrayneo-validation-update/OpenRayneo-validation.apk"
          cp "$RUNNER_TEMP/openrayneo-certs.txt" "$RUNNER_TEMP/openrayneo-validation-update/"
          cp "$RUNNER_TEMP/openrayneo-badging.txt" "$RUNNER_TEMP/openrayneo-validation-update/"
          cp "$RUNNER_TEMP"/openrayneo-dsh-*.tgz "$RUNNER_TEMP/openrayneo-validation-update/"
          cp .build/android-mozilla/mozilla-native-8eada038-r2.sources.tar.gz "$RUNNER_TEMP/openrayneo-validation-update/"
          python3 scripts/validation-update-manifest.py "$RUNNER_TEMP/openrayneo-validation-update"
      - uses: actions/upload-artifact@v4
        if: env.DISTRIBUTE_APK == 'true' && env.APK_TARGET == 'validation'
        with:
          name: openrayneo-validation-update-${{ github.sha }}
          path: ${{ runner.temp }}/openrayneo-validation-update/
          if-no-files-found: error

      # Optional: upload APK and plugin to a Nextcloud "file drop" (upload-only) public share.
      # Store the share link (https://host/s/TOKEN) as repository secret NEXTCLOUD_DROP_URL.
      - name: Upload to Nextcloud
        if: env.DISTRIBUTE_APK == 'true' && env.APK_TARGET == 'release'
        env:
          DROP_URL: ${{ secrets.NEXTCLOUD_DROP_URL }}
        run: |
          if [ -z "$DROP_URL" ]; then echo "No NEXTCLOUD_DROP_URL secret; skipping upload"; exit 0; fi
          base="${DROP_URL%%/s/*}"; token="${DROP_URL##*/s/}"; token="${token%%[/?#]*}"
          version="$OPENRAYNEO_VERSION_NAME"
          short="${GITHUB_SHA::7}"
          upload() {
            # Nextcloud 29+ public DAV first, then the legacy public WebDAV endpoint.
            curl -fsS -T "$1" -H "X-Requested-With: XMLHttpRequest" "$base/public.php/dav/files/$token/$2" \
              || curl -fsS -T "$1" -u "$token:" -H "X-Requested-With: XMLHttpRequest" "$base/public.php/webdav/$2"
            echo "Uploaded $2"
          }
          upload android/app/build/outputs/apk/release/app-release.apk "openrayneo-$version-$short.apk"
          upload "$RUNNER_TEMP"/openrayneo-dsh-*.tgz "openrayneo-dsh-$short.tgz"
          upload .build/android-mozilla/mozilla-native-8eada038-r2.sources.tar.gz "mozilla-native-8eada038-r2-$short.sources.tar.gz"

  publish-validation:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'validation' && inputs.publish_validation == true
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: validation-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openrayneo-validation-update-${{ github.sha }}
          path: verified
      - name: Publish complete validation pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd verified
          code=$(jq -er '.versionCode | select(type == "number" and . > 0)' update-manifest.json)
          signer=$(jq -er '.signerSha256 | select(test("^[0-9a-f]{64}$"))' update-manifest.json)
          tag="validation-v$code"
          test "$(jq -r .commitSha update-manifest.json)" = "$GITHUB_SHA"
          test "$(sha256sum OpenRayneo-validation.apk | cut -d' ' -f1)" = "$(jq -r .apkSha256 update-manifest.json)"
          test "$(stat -c %s OpenRayneo-validation.apk)" = "$(jq -r .apkSize update-manifest.json)"
          existing=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name | test("^validation-v[0-9]+$")) | .tag_name')
          last=$(printf '%s\n' "$existing" | sed -n 's/^validation-v\([0-9]*\)$/\1/p' | sort -n | tail -1)
          if [ -n "$last" ]; then
            test "$code" -gt "$last" || { echo "::error::Validation version must increase; inspect an existing draft before retrying."; exit 1; }
            gh release download "validation-v$last" --pattern update-manifest.json --output "$RUNNER_TEMP/previous-validation.json"
            test "$(jq -r .signerSha256 "$RUNNER_TEMP/previous-validation.json")" = "$signer" || { echo "::error::Previous release signer differs."; exit 1; }
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "OpenRayneo validation $code" --generate-notes --draft --prerelease
          gh release upload "$tag" OpenRayneo-validation.apk update-manifest.json openrayneo-certs.txt openrayneo-badging.txt openrayneo-dsh-*.tgz mozilla-native-8eada038-r2.sources.tar.gz
          gh release edit "$tag" --draft=false
